dry_run = true
num_jobs_per_fetch = 10
num_worker_threads = 1
politeness_factor = 1.0
router_hosts = ["0.0.0.0:8181"]
timeout_seconds = 30
network_policy = "public_only"
max_redirect_hops = 10

[user_agent]
full = "<user_agent>" 
token = "<user_agent_token>" # e.g. 'CrawlBot'

[s3]
access_key = "<access_key>"
bucket = "crawl"
endpoint = "http://s3.stract.com"
folder = "test"
secret_key = "<secret_key>"

[transport]
max_client_slots = 128
max_slots_per_origin = 4
idle_timeout_seconds = 30
dns_cache_entries = 1024
dns_positive_ttl_seconds = 60
dns_negative_ttl_seconds = 5
dns_max_inflight = 32

# C05: admission and body allocations, shared by pages, robots, feeds and sitemaps.
# timeout_seconds remains an upper bound on the complete request.
[body]
max_inflight_bodies = 8
max_reserved_bytes = 536870912
connect_timeout_ms = 10000
header_timeout_ms = 30000
idle_timeout_ms = 10000
total_timeout_ms = 60000
budget_wait_timeout_ms = 10000

[body.html]
wire_limit_bytes = 33554432
decoded_limit_bytes = 33554432

[body.feed]
wire_limit_bytes = 33554432
decoded_limit_bytes = 33554432

[body.sitemap]
wire_limit_bytes = 33554432
decoded_limit_bytes = 33554432

[body.robots]
wire_limit_bytes = 524288
decoded_limit_bytes = 524288

# C07: bounded CPU work and input bytes; control has an independent pool.
[pipeline]
max_inflight_documents = 8
max_inflight_bytes = 268435456
queue_wait_timeout_ms = 30000
runtime_sample_interval_ms = 25
batch_segment_bytes = 67108864
batch_segment_items = 512

[pipeline.parse]
workers = 2
max_items = 4
max_bytes = 134217728

[pipeline.storage]
workers = 1
max_items = 4
max_bytes = 134217728

[pipeline.control]
workers = 1
max_items = 2
max_bytes = 16777216

[pipeline.network_setup]
workers = 1
max_items = 2
max_bytes = 1048576

# C08: durable local ACK, recoverable members and bounded remote publication.
[spool]
directory = "data/crawler-batch/spool"
segment_bytes = 134217728
segment_records = 65536
rotate_seconds = 300
gzip_level = 3
max_spool_bytes = 8589934592
max_segments = 256
commit_records = 16
commit_wait_ms = 10
upload_retry_seconds = 10
upload_timeout_seconds = 60
gc_enabled = false
retention_seconds = 86400
