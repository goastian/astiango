# Inicio aleatorio desde una lista pública real; descubre dominios por sus enlaces.
# scripts/crawler-local.py bootstrap genera este archivo una sola vez.
seeds_file = "data/crawler-local/seeds.txt"
output_path = "data/crawler-local/warc"
status_path = "data/crawler-local/status.json"
state_directory = "data/crawler-local"
pages_per_domain = 50
num_worker_threads = 2
min_crawl_delay_ms = 10000
timeout_seconds = 30
network_policy = "public_only"
max_redirect_hops = 10
max_frontier = 10000
revisit_interval_seconds = 3600

[user_agent]
full = "AstianGOBot/1.0 (+https://astiango.com/webmasters; contact@astian.org)"
token = "AstianGOBot"

[transport]
max_client_slots = 128
max_slots_per_origin = 4
idle_timeout_seconds = 30
dns_cache_entries = 1024
dns_positive_ttl_seconds = 60
dns_negative_ttl_seconds = 5
dns_max_inflight = 32
