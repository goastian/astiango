name: Ingestion continuity integration
permissions:
  contents: read
on:
  pull_request:
    paths: ['scripts/ingestion-*.py', 'scripts/balance-ingestion-cpus.py', 'configs/ingestion/**', 'tools/crawler-dashboard/**', 'packages/i18n/**', '.github/workflows/ingestion-continuity.yaml']
  push:
    paths: ['scripts/ingestion-*.py', 'scripts/balance-ingestion-cpus.py', 'configs/ingestion/**', 'tools/crawler-dashboard/**', 'packages/i18n/**', '.github/workflows/ingestion-continuity.yaml']
jobs:
  retention-and-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: mkdir -p data && python3 scripts/ingestion-retention-integration.py
      - run: npm ci && npm run check && npm run build
        working-directory: tools/crawler-dashboard
